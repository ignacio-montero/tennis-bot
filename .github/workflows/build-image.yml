# Build + publish the tennisbot container image, and run the logic tests.
#
# - On every push/PR: run the pure-logic pytest suite (no browser needed).
# - On a version tag (e.g. `v0.3.0`): after tests pass, build the amd64 image
#   and push it to GHCR as ghcr.io/<owner>/tennisbot-watchd:<version>.
#
# This keeps the image build OFF the homelab (RAM-constrained, must never build
# Chromium images) and off the Mac — GitHub's cloud runners build it. The box
# only ever PULLS a pinned tag.
name: build-image

on:
  push:
    branches: ["**"]
    tags: ["v*.*.*"]
  pull_request:

permissions:
  contents: read

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Install deps (no browsers — tests are pure logic)
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt pytest
      - name: Run tests
        run: PYTHONPATH=src pytest -q

  image:
    # Publish only when a version tag is pushed, and only if tests passed.
    needs: test
    if: startsWith(github.ref, 'refs/tags/v')
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write        # push to GHCR
    steps:
      - uses: actions/checkout@v4
      - name: Derive image tag from git tag (strip leading 'v')
        id: ver
        run: echo "version=${GITHUB_REF_NAME#v}" >> "$GITHUB_OUTPUT"
      - uses: docker/setup-buildx-action@v3
      - name: Log in to GHCR
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      - name: Build and push (amd64 — the homelab is an amd64 N95)
        uses: docker/build-push-action@v6
        with:
          context: .
          file: deploy/docker/Dockerfile
          platforms: linux/amd64
          push: true
          tags: ghcr.io/${{ github.repository_owner }}/tennisbot-watchd:${{ steps.ver.outputs.version }}
